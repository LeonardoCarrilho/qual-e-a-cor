<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qual é a cor?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* Identidade: a página inteira vira a cor sorteada; o texto se ajusta para continuar legível. */
    :root { --cor: #9ec5b8; --texto: #1d2422; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; flex-direction: column;
      background: var(--cor); color: var(--texto);
      font-family: "Familjen Grotesk", system-ui, sans-serif;
      transition: background-color .5s, color .5s;
    }
    button { font: inherit; cursor: pointer; color: inherit; }
    :focus-visible { outline: 3px solid currentColor; outline-offset: 3px; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 20px clamp(16px, 4vw, 40px); }
    header h1 { font-size: 1.15rem; font-weight: 700; }
    .modos { display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: color-mix(in srgb, currentColor 10%, transparent); }
    .modos button { border: 0; background: none; padding: 7px 14px; border-radius: 999px; font-weight: 600; }
    .modos button.ativo { background: color-mix(in srgb, currentColor 16%, transparent); }
    main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 clamp(16px, 4vw, 40px); }
    .rotulo { font-size: 1.05rem; opacity: .75; }
    #cor { font-size: clamp(3rem, 13vw, 9.5rem); font-weight: 700; line-height: 1; letter-spacing: -.03em; word-break: break-word; }
    .acoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
    .acoes button { padding: 13px 24px; border-radius: 999px; font-weight: 700; font-size: 1.05rem; border: 2px solid currentColor; background: none; }
    .acoes button.principal { background: var(--texto); color: var(--cor); border-color: var(--texto); }
    footer { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; padding: 20px clamp(16px, 4vw, 40px) 24px; }
    #historico { list-style: none; display: flex; gap: 8px; flex-wrap: wrap; }
    #historico button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid color-mix(in srgb, currentColor 35%, transparent); }
    footer small { opacity: .7; }
    @media (prefers-reduced-motion: reduce) { body { transition: none; } }
  </style>
</head>
<body>
  <header>
    <h1>Qual é a cor?</h1>
    <nav class="modos" aria-label="Formato da cor">
      <button class="ativo" data-modo="nome">Nomes CSS</button>
      <button data-modo="hexa">Hexadecimal</button>
      <button data-modo="rgb">RGB</button>
    </nav>
  </header>
  <main>
    <p class="rotulo">A cor de fundo agora é</p>
    <p id="cor" aria-live="polite">#9EC5B8</p>
    <div class="acoes">
      <button id="mudar" class="principal">Sortear outra cor</button>
      <button id="copiar">Copiar código</button>
    </div>
  </main>
  <footer>
    <ul id="historico" aria-label="Últimas cores. Clique para voltar a uma delas."></ul>
    <small>Feito por Leonardo Carrilho com JavaScript.</small>
  </footer>
  <script src="app.js"></script>
</body>
</html>
