<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Qual é a cor?</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { transition: background-color .4s; min-height: 100vh; }
    .painel { background: #fffc; backdrop-filter: blur(4px); }
    #cor { font-family: ui-monospace, monospace; }
  </style>
</head>
<body class="d-flex flex-column">
  <header class="navbar navbar-dark bg-dark px-3">
    <h2 class="navbar-brand m-0 fs-4">🎨 Qual é a cor?</h2>
    <nav class="btn-group" role="group" aria-label="Modo">
      <button class="btn btn-outline-light active" data-modo="nome">Nomes CSS</button>
      <button class="btn btn-outline-light" data-modo="hexa">Hexadecimal</button>
      <button class="btn btn-outline-light" data-modo="rgb">RGB</button>
    </nav>
  </header>
  <main class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
    <div class="painel rounded-4 shadow p-4 p-md-5 text-center">
      <h1 class="h3 mb-3">Cor de fundo: <span id="cor" class="fw-bold">white</span></h1>
      <div class="d-flex gap-2 justify-content-center flex-wrap">
        <button id="mudar" class="btn btn-dark btn-lg">Mudar de cor</button>
        <button id="copiar" class="btn btn-outline-dark btn-lg">Copiar código</button>
      </div>
      <ul id="historico" class="list-inline mt-4 mb-0" aria-label="Últimas cores"></ul>
    </div>
  </main>
  <footer class="text-center small py-2 bg-dark text-light">Feito por Leonardo Carrilho</footer>
  <script src="app.js"></script>
</body>
</html>
